name: 뉴스 수집

on:
  schedule:
    # 21:30 UTC = 06:30 KST. GitHub 의 cron 은 UTC 기준이다.
    # 예약 실행은 러너가 붐비면 수십 분 밀릴 수 있다 — 정시 보장이 아니다.
    - cron: '30 21 * * *'
  workflow_dispatch:

# 기본 GITHUB_TOKEN 으로 커밋을 밀어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  # 예약 실행과 수동 실행이 겹쳐 같은 파일을 동시에 밀지 않게 한다.
  group: ingest-news
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 뉴스 수집
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 모델을 바꾸려면 저장소 variable 로 OPENAI_MODEL 을 두면 된다. 없으면 기본값.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        # 수집기는 어느 소스가 죽어도 성공으로 끝난다. 여기서 실패하면 진짜 고장이다.
        run: npm run ingest

      - name: 변경이 있으면 커밋
        run: |
          set -euo pipefail

          # content/news/ 밖의 변경(빌드 산출물 등)은 담지 않는다.
          if git diff --quiet -- content/news/ && \
             [ -z "$(git status --porcelain --untracked-files=all -- content/news/)" ]; then
            echo "새 기사 없음 — 커밋하지 않는다."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/news/
          git commit -m "chore: 뉴스 수집 $(date -u -d '+9 hours' '+%Y-%m-%d')"

          # 그 사이 다른 커밋이 들어왔으면 push 가 거부된다. 리베이스하고 한 번 더 시도한다.
          # content/news/ 만 건드리므로 리베이스 충돌 가능성은 낮다.
          git push || {
            git pull --rebase --autostash
            git push
          }
